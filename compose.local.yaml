name: manta-test

services:
  manta:
    image: manta:local
    build:
      context: .
      dockerfile: docker/local.Dockerfile
    container_name: manta-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:2023:2023"
    environment:
      TZ: Europe/London
      WINGS_UID: "988"
      WINGS_GID: "988"
      WINGS_USERNAME: pterodactyl
    networks:
      panel:
        aliases:
          - manta.localhost
      servers:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - config:/etc/pterodactyl
      # Sibling game containers must see the same path as the Docker host.
      - "data:${MANTA_DATA_PATH:-/var/lib/docker/volumes/manta-test_data/_data}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "nc", "-z", "127.0.0.1", "8083"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

volumes:
  config:
    external: true
    name: manta-test_config
  data:
    external: true
    name: manta-test_data

networks:
  panel:
    external: true
    name: aquadactyl-test_default
  servers:
    external: true
    name: manta-test_servers
