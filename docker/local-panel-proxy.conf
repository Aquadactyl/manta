# Browsers resolve manta.localhost to the Docker host. The Panel's HTTP client
# resolves it to its own loopback, which this listener forwards over Docker DNS.
server {
    listen 127.0.0.1:8083;
    server_name manta.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    # Manta enforces its JSON and upload limits while streams stay unbuffered.
    client_max_body_size 0;

    location / {
        set $manta_endpoint http://manta-test:8083;
        proxy_pass $manta_endpoint;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
