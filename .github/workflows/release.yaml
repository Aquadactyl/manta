name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve release configuration
        id: resolve-release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            IS_PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          if [[ "$TAG" == *-* ]]; then IS_PRERELEASE=true; fi
          [[ ${#TAG} -le 100 && "$TAG" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || exit 64
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use a v-prefixed version or versioned prerelease." >&2
            exit 1
          fi

      - name: Prepare immutable release source
        run: |
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "refs/tags/$RELEASE_TAG"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'Aquadactyl CI'
            VERSION="${RELEASE_TAG#v}"
            sed -i "s/var Version = \".*\"/var Version = \"$VERSION\"/" system/const.go
            git add system/const.go
            git commit -m "Release $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          grep -Fq "var Version = \"${RELEASE_TAG#v}\"" system/const.go

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.4"

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${RELEASE_TAG#v}" bash scripts/build-release.sh
          test "$(dist/wings_linux_amd64 version | head -n 1)" = "manta ${RELEASE_TAG#v}"

      - name: write changelog
        run: |
          awk -v heading="## $RELEASE_TAG" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > RELEASE_CHANGELOG
          test -s RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.resolve-release.outputs.release_tag }}
          tag_name: ${{ steps.resolve-release.outputs.release_tag }}
          target_commitish: ${{ steps.resolve-release.outputs.release_tag }}
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.resolve-release.outputs.is_prerelease == 'true' }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/*
