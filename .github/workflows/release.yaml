name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Resolve release configuration
        id: resolve-release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_VERSION" | xargs)"
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            IS_PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use a v-prefixed version or versioned prerelease." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOARCH=amd64 go build -o dist/wings_linux_amd64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${RELEASE_TAG}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_amd64
          GOARCH=arm64 go build -o dist/wings_linux_arm64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${RELEASE_TAG}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_arm64
          cd dist && sha256sum wings_linux_* > checksums.txt && cd ..

      - name: create release branch and bump version
        run: |
          VERSION="${RELEASE_TAG#v}"
          BRANCH="release/$RELEASE_TAG"
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'Manta CI'
          git checkout -b "$BRANCH"
          sed -i "s/var Version = \".*\"/var Version = \"$VERSION\"/" system/const.go
          git add system/const.go
          git commit -m 'ci(release): bump version'
          git push -u origin "$BRANCH"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]; then
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
              git push origin "$RELEASE_TAG"
            fi
          fi

      - name: write changelog
        run: |
          sed -n "/^## $RELEASE_TAG/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.resolve-release.outputs.release_tag }}
          tag_name: ${{ steps.resolve-release.outputs.release_tag }}
          target_commitish: release/${{ steps.resolve-release.outputs.release_tag }}
          draft: false
          prerelease: ${{ steps.resolve-release.outputs.is_prerelease == 'true' }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/*
