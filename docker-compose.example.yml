version: "3.8"

services:
  manta:
    image: ghcr.io/aquadactyl/manta:v1.1-beta.3
    restart: always
    networks:
      - manta0
    ports:
      - "8080:8080"
      - "2022:2022"
    tty: true
    environment:
      TZ: "UTC"
      MANTA_UID: 988
      MANTA_GID: 988
      MANTA_USERNAME: aquadactyl
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/aquadactyl/:/etc/aquadactyl/"
      - "/var/lib/aquadactyl/:/var/lib/aquadactyl/"
      - "/var/log/aquadactyl/:/var/log/aquadactyl/"
      - "/tmp/aquadactyl/:/tmp/aquadactyl/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "/run/manta:/run/manta"
      # Required for ssl if you use let's encrypt. uncomment to use.
      #- "/etc/letsencrypt/:/etc/letsencrypt/"

networks:
  manta0:
    name: manta0
    driver: bridge
    ipam:
      config:
        - subnet: "172.21.0.0/16"
    driver_opts:
      com.docker.network.bridge.name: manta0
