name: manta-benchmark
services:
  wings-benchmark:
    image: manta-benchmark:wings
    container_name: wings-benchmark
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      TZ: Europe/London
      GOMAXPROCS: "2"
      WINGS_UID: "988"
      WINGS_GID: "988"
    ports:
      - 127.0.0.1:8084:8084
      - 127.0.0.1:2024:2024
    networks:
      panel:
        aliases: [wings-benchmark.localhost]
      servers:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - config:/etc/pterodactyl
      - data:/var/lib/docker/volumes/manta-benchmark-wings_data/_data
    healthcheck:
      test: [CMD, /usr/local/bin/busybox, nc, -z, 127.0.0.1, "8084"]
      interval: 5s
      start_period: 10s
      retries: 12
volumes:
  config:
    external: true
    name: manta-benchmark-wings_config
  data:
    external: true
    name: manta-benchmark-wings_data
networks:
  panel:
    external: true
    name: aquadactyl-test_default
  servers:
    external: true
    name: manta-benchmark-wings_servers
