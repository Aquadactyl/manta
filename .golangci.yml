version: "2"

# Manta builds for Linux and macOS; run with GOOS=linux (see `make lint`) so the
# _linux/_unix files are type-checked and linted, and with GOOS=darwin for the
# _darwin files.

linters:
  default: standard
  enable:
    - gosec
    - staticcheck
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors, already reported by errcheck
        - G115 # integer overflow on conversion, too noisy for stat/syscall code
    # Optional: Configure staticcheck minimum Go version if needed
    staticcheck:
      checks: ["all"]

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      # Explicit embedded-field selectors (e.g. f.File.Seek in a wrapper type)
      # are kept on purpose.
      - linters:
          - staticcheck
        text: "QF1008:"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
